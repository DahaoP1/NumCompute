# Both assignments share this distribution; benchmark runners are included.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "NumPy scientific computing and buffered decision trees with incremental preprocessing, metrics and matplotlib plots."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "matplotlib"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["numcompute", "numcompute_stream", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
